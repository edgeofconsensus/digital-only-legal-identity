name: test

on:
  push:
    branches: [main, feature/signed-assertions-event-store]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r reference/requirements.txt
      - run: pytest -q reference/tests
