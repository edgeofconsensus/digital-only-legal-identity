name: test

on:
  push:
    branches: [main, feature/signed-assertions-event-store]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r reference/requirements.txt
      - run: pytest -q reference/tests
